# Run the LIVE platform fully in containers on the existing live data.
#   docker compose -f docker-compose.yml -f docker-compose.live.yml --profile live up -d --build
# Needs .env (credentials, CASE_ISSUES) and SUPERSET_REPO_PATH pointing at the prepared Superset fork checkout.
services:
  web:
    build: {context: ., target: live}
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8010}:8000"
    environment:
      DATA_DIR: /data
      SUPERSET_REPO_PATH: /superset
      SUPERSET_PYTHON: /opt/superset-venv/bin/python
    volumes: !override
      - ${LIVE_DATA_PATH:-./data}:/data
      - ${SUPERSET_REPO_PATH:-./.superset}:/superset
  worker:
    build: {context: ., target: live}
    environment:
      DATA_DIR: /data
      SUPERSET_REPO_PATH: /superset
      SUPERSET_PYTHON: /opt/superset-venv/bin/python
    volumes: !override
      - ${LIVE_DATA_PATH:-./data}:/data
      - ${SUPERSET_REPO_PATH:-./.superset}:/superset
