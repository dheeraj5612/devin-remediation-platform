<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2455ef">
  <meta name="description" content="{{ description|default('Trace approved findings through Devin sessions, candidate pull requests, and independent validation. Read the evidence before you review a repair.') }}">
  <meta name="robots" content="{{ 'index,follow' if page_name == 'overview' else 'noindex,nofollow' }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ request.base_url }}static/social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Proofline — independent proof for autonomous repair">
  <meta name="twitter:card" content="summary_large_image">
  {% if page_name == 'overview' %}<link rel="canonical" href="{{ request.base_url }}"><meta property="og:url" content="{{ request.base_url }}">{% endif %}
  <meta property="og:title" content="{{ title }} · Proofline">
  <meta property="og:description" content="Independent evidence for Devin-powered remediation. A candidate is not a verified repair.">
  <title>{{ title }} · Proofline</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/site.webmanifest">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="page-{{ page_name }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Proofline home"><img class="brand-mark" src="/static/mark.svg" width="34" height="34" alt=""><img class="brand-word" src="/static/wordmark.svg" width="218" height="32" alt="Proofline"></a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="/" {{ 'aria-current=page' if page_name == 'overview' else '' }}>Overview</a>
      <a href="/dashboard" {{ 'aria-current=page' if page_name in ['dashboard','job'] else '' }}>Workbench</a>
      <a href="/cases" {{ 'aria-current=page' if page_name == 'cases' else '' }}>Contracts</a>
      <a href="/evidence" {{ 'aria-current=page' if page_name == 'evidence' else '' }}>Proof</a>
    </nav>
    <span class="header-note"><span class="square-dot" aria-hidden="true"></span>Read-only by design</span>
  </header>
  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>Proofline <span class="muted">/ Devin Remediation Platform</span></span><a href="https://github.com/dheeraj5612/devin-remediation-platform">Source &amp; setup <span aria-hidden="true">↗</span></a></footer>
  <div id="notice" class="notice" hidden><p id="notice-message" role="status" aria-live="polite"></p><button class="notice-dismiss" type="button" data-dismiss>Dismiss</button></div>
</body>
</html>
