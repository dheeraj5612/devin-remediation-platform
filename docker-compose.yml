services:
  web:
    build:
      context: .
      target: control
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    build:
      context: .
      target: control
    command: ["python", "worker.py"]
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      web:
        condition: service_healthy
