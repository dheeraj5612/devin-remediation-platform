name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned project dependencies
        run: python -m pip install --constraint constraints.txt '.[dev]'

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest
