[project]
name = "devin-remediation-platform"
version = "0.1.0"
description = "Event-driven test remediation with independent regression validation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["F", "E9"]
