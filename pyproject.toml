[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-remediation-platform"
version = "0.1.0"
description = "Independently evaluated, event-driven code and test remediation"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "SQLAlchemy==2.0.50",
  "httpx==0.28.1", "pydantic==2.13.4", "pydantic-settings==2.14.1",
  "Jinja2==3.1.6", "PyYAML==6.0.3", "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.0"]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.setuptools.package-data]
# The dated archive is a packaged copy; a regression test guards exact source parity.
app = ["templates/*.html", "static/*", "archive/*.json"]
evals = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
