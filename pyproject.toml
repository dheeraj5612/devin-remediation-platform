[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devin-remediation-platform"
version = "0.1.0"
description = "Event-driven system that converts a confirmed weak-test finding into an independently validated candidate PR using Devin."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "jinja2>=3.1,<4",
    "pyyaml>=6.0,<7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
drp = "drp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["drp"]
mypy_path = "src"
plugins = []

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
